# Бесплатные проекты Supabase ставятся на паузу после недели без активности.
# Этот workflow раз в 3 дня делает лёгкий запрос, чтобы проект не засыпал.
# Нужны secrets репозитория: SUPABASE_URL и SUPABASE_PUBLISHABLE_KEY (публичные значения).
name: keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" -o /dev/null
